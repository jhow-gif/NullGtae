[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nullgate"
version = "0.2.0"
description = "Open-source security gateway and guardrails proxy for AI agents and LLMs."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
]

[project.scripts]
nullgate = "nullgate.cli:main"

[tool.setuptools.packages.find]
include = ["nullgate*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]